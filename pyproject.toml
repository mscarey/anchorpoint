[project]
name = "anchorpoint"
version = "0.9.0"
description = "text substring selectors for anchoring annotations"
authors = [
    {name = "Matt Carey", email = "matt@authorityspoke.com"},
]
readme = "README.rst"
requires-python = ">=3.13"
license-files = ["license.md"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.12.0",
    "python-ranges>=1.2.2",
    "sympy>=1.14.0",
]

[project.urls]
Homepage = "https://github.com/mscarey/anchorpoint"
Documentation = "https://anchorpoint.readthedocs.io/en/latest/"

[dependency-groups]
build = [
    "build",
    "twine",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
]
docs = [
    "sphinx-autodoc-typehints>=3.17.2",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]
